name: CI Checks for PR

on: push

jobs:
  check:
    name: Run ESLint + Prettier + TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run npm install
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check

      - name: Run TypeScript
        run: npm run type:check
  test:
    name: Run tests
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run npm install
        run: npm ci

      - name: Create .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat <<EOF > .env.test
          DATABASE_URL='$DATABASE_URL'
          EOF

      - name: Run tests
        run: node --run test:check
